command-msg:
  perm-fail: "&cAccess denied."
  help-command-view-req: "&cUnknown commmand. Type /apve help for see available commands. "
  help-command-msg: 
    - "&aAvailable commands:"
    - "&2/apve reload — Reload APVE's configuration"
    - "&2/apve warns show <nickname> — View the player's warns history"
    - "&2/apve warns remove <nickname> <integer> — Remove the player's warns. The removing warns equals <integer> argument."
    - "&2/apve warns clear <nickname> — Remove all the player's warns."
    - "&2/apve notify toggle — Toggles notifies about player's violations."

  cfg-reload-msg: "&1Reloading configuration..."
  invalid-syntax: "&cInvalid syntax. Usage: {usage}"
  invalid-number: "&cArgument '{arg}' must be a valid number."

  violation-notify-msg: "&cNOTIFY: Player &e{player} &chas sended message with &f{message} &cwhich violates the &4{type} &cdue to its similarity/equality to &e{word}."
  notify-activate-msg: "&aSucessfully &2enabled &anotifies about the player's violations."
  notify-disabled-msg: "&aSucessfully &4disabled &anotifies about the player's violations."
  player-only: "&cExecutor must be a player."
  
  warns:
    no-warns: "&ePlayer {player} currently has no active warns."
    show: "&aPlayer &e{player} &ahas &c{amount} &aactive warns. Highest violation rule: &c{violation}&a."
    removed: "&aSuccessfully removed &e{amount} &awarns from &e{player}&a. Remaining warns: &e{left}&a."
    cleared: "&aAll warns successfully cleared for &e{player}&a."

  check:
    header: "&8[&bA.P.V.E Word Checker&8]"
    raw: "&7Input text: &f{raw}"
    normalized: "&7Normalized text: {normalized}"
    status: "&7Check status: {status_color}{status}"
    matched-word: "&7Founded word: &e{word}"
    dict-word: "&7From-dictionary sample: &6{dict}"
    detail: "&7Check details: &b{detail}"
    status-colors:
      malicious: "&c"
      suspicious: "&e"
      none: "&a"





  
