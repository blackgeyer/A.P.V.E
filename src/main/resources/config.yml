punishments:
  # Punishment commands (Don't forget to configure this command syntax for your installed punishments plugin!)
  
  mute-command: "mute %player% %duration% %reason%"
  ban-command: "ban %player% %duration% %reason%"
  banip-command: "banip %ip% %duration% %reason%"
  kick-command: "kick %player% %reason%"





  punishments-is-enabled: true

  # If you write this keywords below instead of normal string duration, (Like 2h or 9d) you convert punishment command from temporary to permanent mode. 
  perm-keywords:
    - "permanent"
    - "perm"
    - "infinity"
    - "inf"
    - "-1"

  
priority:
  # Violation priority. It is necessary to punish for the most priority violation.
  caps: 1
  spam: 2
  insult: 3
  adult-content: 4
  family-insult: 5
  social-media: 6
  advertisement: 7


warns:
  # The warn limit. If violator reaches the maximum of the limit, plugin give them a punishment. If warn limit is disabled, the plugin gives a punishment to the violator without any latency or warn message. Not recommended to disable the warn-limit if you want a justice in the chat. Also, don't leave the warns enabled if you disabled the punishment if you want for correct plugin work.
  warn-limit: 2
  warn-limit-is-enabled: true
  warn-message: |
      &cYour message has been censored due to rule-violating words/meanings in it
      &cPlease, communicate in the chat without any rules-violating words/meanings.
  last-warn-message: |
      &cThis is last warn. Don't write the rule-violating message.
      &cOtherwise, you will be punished by A.P.V.E.

  # If true, warns resets when server reloads or stops. Not recommended to disable if you want some freedom in chat in the your server.
  warn_reset_when_server_restarts: true

  # If true, warns may reset after a N. Not recommended to disable if you want some freedom in chat in the your server.
  temporary-warns: true

  # Time before N warns are reset. N = warn_reset_count
  warn-reset-time: "1h"
  warn_reset_count: 2
  warns-is-enabled: true

insult:
  is-enabled: true
  punishment-is-enabled: true
  duration: "30m"
  reason: "&cYou have been punished due to insulting."

  
  type: "mute"
  blocking-reason: "&cYour message was blocked because it contains insults."

  # If enabled, the plugin blocks the message. Consequently, the message don't reachs to the chat. This mode is incompatible with censorship modes.
  blocking: false

  censor-reason: "&cYour message was censored because it contains insults."

  # If censorship is enabled, the plugin censores message fully. The enabled mode must be only one. (I know it is only one censorship mode but in future i will add the new censoreship modes)
  censor: true

family-insult:

  is-enabled: true
  punishment-is-enabled: true
  duration: "8h"
  reason: "&cYou have been punished due to insulting relatives."
  
  type: "mute"
  blocking-reason: "&cYour message was blocked because it contains family insults."
  blocking: false
  censor-reason: "&cYour message was censored because it contains family insults."
  censor: true

ad-dist:
  
