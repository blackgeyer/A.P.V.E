punishments:
  mute-command: "mute %player% %duration% %reason%"
  ban-command: "ban %player% %duration% %reason%"
  banip-command: "ipban %ip% %duration% %reason%"
  kick-command: "kick %player% %reason%"

  punishments-is-enabled: true

  perm-keywords:
    - "permanent"
    - "perm"
    - "infinity"
    - "inf"
    - "-1"

priority:
  caps: 1
  spam: 2
  insult: 3
  adult-content: 4
  family-insult: 5
  staff-insult: 6
  soc-media-dist: 7
  ad-dist: 8

# If true, the plugin will not apply any warn/censor/blocking etc. to the violators. Plugin will only log every violate. 
# This mode is incompatible with punishments and warns. Consequently, if you enable this mode with another auctions, A.P.V.E's work will aborted.
audit-mode: false

# If false, APVE will not send messages about player's violations to the console.
console-log: false

# If true, APVE will send notifies about player's violations in game to the player's, which has apve.violation.notify permission.
notifies: true



warns:
  warn-limit: 2
  warn-limit-is-enabled: true
  warn-message: |
      &cYou have been warned by A.P.V.E. due to rule violating.
      &cPlease, communicate in the chat without any rules-violating words/meanings.
  last-warn-message: |
      &cThis is last warn. Don't write the rule-violating message.
      &cOtherwise, you will be punished by A.P.V.E.

  warn_reset_when_server_restarts: true
  temporary-warns: true
  warn-reset-time: "1h"
  warn_reset_count: 2
  warns-is-enabled: true

insult:
  is-enabled: true
  punishment-is-enabled: true
  duration: "30m"
  reason: "&cYou have been muted due to insulting."
  type: "mute"
  blocking-reason: "&cYour message was blocked because it contains insults."
  blocking: true
  censor-reason: "&cYour message was censored because it contains insults."
  censor: false

family-insult:
  is-enabled: true
  punishment-is-enabled: true
  duration: "8h"
  reason: "&cYou have been muted due to insulting relatives."
  type: "mute"
  blocking-reason: "&cYour message was blocked because it contains family insults."
  blocking: true
  censor-reason: "&cYour message was censored because it contains family insults."
  censor: false

ad-dist:
  is-enabled: true
  punishment-is-enabled: true
  duration: "perm"
  reason: "&cYou have been banned from the server due to distribution of advertisement."
  type: "banip"
  blocking-reason: "&cYour message was blocked because it contains advertisement distribution."
  blocking: true
  censor-reason: "&cYour message was censored because it contains advertisement distribution."
  censor: false

soc-media-dist:
  is-enabled: true
  punishment-is-enabled: true
  duration: "180m"
  reason: "&cYou have been banned from the server due to social media distribution."
  type: "ban"
  blocking-reason: "&cYour message was blocked because it contains social media distribution."
  blocking: true
  censor-reason: "&cYour message was censored because it contains social media distribution."
  censor: false

adult-content:
  is-enabled: true
  punishment-is-enabled: true 
  type: "mute"
  duration: "8h"
  reason: "&cYou have been muted due to 18+ content mention."
  blocking-reason: "&cYour message was blocked because it contains adult (18+) content."
  blocking: true
  censor-reason: "&cYour message was censored because it contains adult (18+) content."
  censor: false

staff-insult:
  is-enabled: true
  punishment-is-enabled: true
  type: "mute"
