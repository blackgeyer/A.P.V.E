  reason: "&cYou have been punished due to 18+ content (drugs / sexual)."
  blocking-reason: "&cYour message was blocked because it contains adult (18+) content."
  blocking: true
  censor-reason: "&cYour message was censored because it contains adult (18+) content."
  censor: false
      
 
spam:
  is-enabled: true
  punishment-is-enabled: true
 
  max-similar-messages: 3
 
  time-window-seconds: 60
 
  similarity-threshold: 0.75

  
  type: "mute"
  duration: "30m"
  reason: "&cYou have been punished due to spam."
  blocking-reason: "&cYour message was blocked because it is a spam."
  blocking: false

caps:
  is-enabled: true
  punishment-is-enabled: false
  min-message-length: 6
  min-caps-percentage: 70
  
  type: "mute"
  duration: "15m"
  reason: "&cYou have been punished due to excessive caps."

  blocking-reason: "&cYour message was blocked because it is wrotten in upper case."
  blocking: false
  censor-reason: "&cYour message was censored because it is wrotten in upper case."
  censor: false

