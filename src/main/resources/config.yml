  reason: "&cYou have been muted due to staff insulting."
  blocking-reason: "&cYour message was blocked because it contains staff insulting."
  blocking: true
  censor-reason: "&cYour message was censored because it contains staff insulting"
  censor: false
      
spam:
  is-enabled: true
  punishment-is-enabled: true
  max-similar-messages: 3
  time-window-seconds: 60
  similarity-threshold: 0.90
  type: "mute"
  duration: "20m"
  reason: "&cYou have been muted due to spam."
  blocking-reason: "&cYour message was blocked because it is a spam."
  blocking: false

caps:
  is-enabled: true
  punishment-is-enabled: false
  min-message-length: 6
  min-caps-percentage: 70
  type: "mute"
  duration: "15m"
  reason: "&cYou have been muted due to excessive caps."
  blocking-reason: "&cYour message was blocked because it is written in upper case."
  blocking: false
  censor-reason: "&cYour message was censored because it is written in upper case."
  censor: false

