    - "&2/apve warns show <nickname> — View the player's warns history"
    - "&2/apve warns remove <nickname> <integer> — Remove the player's warns. The removing warns equals <integer> argument."
    - "&2/apve warns clear <nickname> — Remove all the player's warns."

